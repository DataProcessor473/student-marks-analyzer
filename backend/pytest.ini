[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = auto

# Silence deprecation warnings from third-party libs and from Pydantic V1
# compat shims. Our own code is being migrated separately.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
